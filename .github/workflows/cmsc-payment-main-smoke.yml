name: CMSC payment main smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Import main application
        env:
          SECRET_KEY: ci-smoke-secret
          APP_ENV: development
          PYTHONPATH: .
        run: python -c "from backend.main import app; print('main import ok', len(app.routes))"
      - name: Run payment API smoke
        env:
          CMSC_PAYMENT_WEBHOOK_SECRET: smoke-secret
          SECRET_KEY: ci-smoke-secret
          APP_ENV: development
          PYTHONPATH: .
        run: python scripts/test_cmsc_payment_api.py
      - name: Run payment confirmation smoke
        env:
          SECRET_KEY: ci-smoke-secret
          APP_ENV: development
          PYTHONPATH: .
        run: python scripts/test_cmsc_payment_confirmation.py
