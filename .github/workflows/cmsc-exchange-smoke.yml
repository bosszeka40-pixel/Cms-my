name: CMSC exchange smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Test CMSC exchange quote
        env:
          PYTHONPATH: .
        run: python scripts/test_cmsc_exchange.py
      - name: Test CMSC exchange API auth
        env:
          PYTHONPATH: .
        run: python scripts/test_cmsc_exchange_api_auth.py
      - name: Test CMSC exchange validation
        env:
          PYTHONPATH: .
        run: python scripts/test_cmsc_exchange_validation.py
      - name: Test CMSC exchange rate limit
        env:
          PYTHONPATH: .
        run: python scripts/test_cmsc_exchange_rate_limit.py
