name: cms-smoke

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --no-cache-dir -r requirements.txt
      - run: python -m compileall backend
      - run: python healthcheck.py
      - name: Start CMS
        run: |
          uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/cms.log 2>&1 &
          echo $! > /tmp/cms.pid
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/health
          curl --fail --silent http://127.0.0.1:8000/ready
      - name: Stop CMS
        if: always()
        run: |
          if [ -f /tmp/cms.pid ]; then kill $(cat /tmp/cms.pid) || true; fi
          cat /tmp/cms.log || true
