name: CMS smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify repository access
        env:
          GH_TOKEN: ${{ github.token }}
        run: curl --fail-with-body -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}"
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          clean: true
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Import application
        run: python healthcheck.py
      - name: Start CMS
        env:
          SECRET_KEY: ci-smoke-secret
          APP_ENV: development
          PORT: '8000'
        run: |
          nohup python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/cms.log 2>&1 &
          echo $! > /tmp/cms.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
      - name: Check readiness
        run: curl -fsS http://127.0.0.1:8000/ready
      - name: Stop CMS
        if: always()
        run: |
          if [ -f /tmp/cms.pid ]; then kill $(cat /tmp/cms.pid) || true; fi
          cat /tmp/cms.log || true
