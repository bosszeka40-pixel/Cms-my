<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход в Super CMS</title>
  <style>
    :root { color-scheme: dark; --bg:#07111f; --panel:#101b2d; --accent:#2dd4bf; --text:#f8fafc; --muted:#94a3b8; --border:#243447; }
    *{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,sans-serif;background:linear-gradient(135deg,#07111f,#0f172a);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(100%,460px);background:rgba(16,27,45,.96);border:1px solid var(--border);box-shadow:0 20px 50px rgba(0,0,0,.35);border-radius:20px;padding:28px}
    h1{font-size:1.5rem;margin:0 0 6px}.sub{color:var(--muted);margin-bottom:22px}
    .field{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}.label{font-size:.95rem;color:#cbd5e1}
    .input-wrap{display:flex;align-items:center;gap:10px;background:#0b1422;border:1px solid var(--border);border-radius:12px;padding:12px 14px}
    .input-wrap input{background:transparent;border:none;outline:none;color:var(--text);width:100%}
    .input-wrap svg{flex-shrink:0;fill:var(--muted)}
    .row{display:flex;justify-content:space-between;align-items:center;font-size:.92rem;margin:6px 0 16px}
    .row a{color:var(--accent);text-decoration:none}
    .btn{width:100%;border:none;border-radius:12px;padding:13px 16px;background:linear-gradient(135deg,var(--accent),#38bdf8);color:#07111f;font-weight:700;cursor:pointer}
    .socials{margin-top:18px}.social-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);background:#0b1422;color:var(--text);margin:8px 0;cursor:pointer}
    .divider{text-align:center;color:var(--muted);margin:16px 0 8px;position:relative}.divider:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--border);z-index:0}.divider span{position:relative;padding:0 12px;background:var(--panel);z-index:1}
    .link-row{margin-top:16px;text-align:center;color:var(--muted)} .link-row a{color:var(--accent);text-decoration:none}
  </style>
</head>
<body>
  <div class="card">
    <h1>Вход в систему Super CMS</h1>
    <div class="sub">Добро пожаловать обратно. Введите учетные данные для доступа.</div>
    <form>
      <div class="field">
        <label class="label" for="username">Email или имя пользователя</label>
        <div class="input-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-3.31 0-6 1.79-6 4v1h12v-1c0-2.21-2.69-4-6-4Z"/></svg>
          <input id="username" type="text" placeholder="user@example.com" />
        </div>
      </div>
      <div class="field">
        <label class="label" for="password">Пароль</label>
        <div class="input-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2Zm-5 7a1.5 1.5 0 1 1 1.5-1.5A1.5 1.5 0 0 1 12 16Zm2-7H10V7a2 2 0 1 1 4 0Z"/></svg>
          <input id="password" type="password" placeholder="••••••••" />
        </div>
      </div>
      <div class="row">
        <label><input type="checkbox" /> Запомнить меня</label>
        <a href="forgot-password.html">Забыли пароль?</a>
      </div>
      <button class="btn" type="button" onclick="location.href='dashboard.html'">Войти</button>
    </form>
    <div class="divider"><span>или войти через</span></div>
    <div class="socials">
      <button class="social-btn">🔍 Войти через Google</button>
      <button class="social-btn">🐙 Войти через GitHub</button>
      <button class="social-btn">📱 Войти через Telegram</button>
    </div>
    <div class="link-row">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></div>
  </div>
</body>
</html>
