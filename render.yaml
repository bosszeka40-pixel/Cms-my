services:
  - type: web
    name: Cms-my
    runtime: python
    plan: starter
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: SESSION_HTTPS_ONLY
        value: "true"
      - key: SECRET_KEY
        generateValue: true
