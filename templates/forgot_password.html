{% extends 'base.html' %}

{% block content %}
    <h1 class="page-title">Восстановление доступа</h1>
    <p class="lead">Введите email, указанный при регистрации, и мы отправим инструкции по сбросу пароля.</p>
    {% if message %}
        <div class="message">{{ message }}</div>
    {% endif %}
    <form method="post">
        <div class="field-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="example@mail.com" required>
        </div>
        <button type="submit" class="btn">Отправить инструкции</button>
    </form>
    <p style="margin-top: 20px;">Вспомнили пароль? <a href="{{ url_for('login') }}">Вернуться ко входу</a></p>
{% endblock %}
