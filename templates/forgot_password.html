<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление — CMS Trading</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="dark">
<div class="auth-page">
    <div class="card">
        <div style="text-align:center;margin-bottom:1.5rem;">
            <span style="font-size:2rem;">🔒</span>
            <h1>Восстановление пароля</h1>
        </div>
        {% if message %}<div class="message success">{{ message }}</div>{% endif %}
        <form method="post" action="{{ url_for('forgot_password_submit') }}">
            <div class="field-group">
                <label>Email</label>
                <input type="email" name="email" required placeholder="your@email.com">
            </div>
            <button class="btn btn-block" type="submit">Отправить инструкции</button>
        </form>
        <div class="link-row" style="margin-top:1rem;text-align:center;font-size:.82rem;">
            <a href="{{ url_for('login') }}">← Вернуться к входу</a>
        </div>
    </div>
</div>
</body>
</html>
