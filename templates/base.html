<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{{ theme|default('light') }}">
    <header>
        <h2>Super CMS V12</h2>
        <nav>
            <a href="{{ url_for('index') }}">Главная</a>
            {% if user_id %}
                <a href="{{ url_for('dashboard') }}">Дашборд</a>
                <a href="{{ url_for('wallet_page') }}">Кошелёк</a>
                <a href="{{ url_for('marketplace') }}">Маркетплейс</a>
                <a href="{{ url_for('bot_management') }}">Бот</a>
                {% if is_admin %}
                    <a href="{{ url_for('admin_panel') }}">Админ</a>
                {% endif %}
                <a href="{{ url_for('logout') }}">Выйти</a>
            {% else %}
                <a href="{{ url_for('login') }}">Войти</a>
                <a href="{{ url_for('register') }}">Регистрация</a>
            {% endif %}
        </nav>
    </header>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
