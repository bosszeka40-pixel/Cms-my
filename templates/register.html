<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — CMS Trading</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="dark">
<div class="auth-page">
    <div class="card">
        <div style="text-align:center;margin-bottom:1.5rem;">
            <span style="font-size:2rem;">₿</span>
            <h1>Регистрация</h1>
            <p class="muted" style="font-size:.82rem;">Создайте аккаунт для торговли</p>
        </div>

        {% if message %}<div class="message error">{{ message }}</div>{% endif %}

        <form method="post" action="{{ url_for('register') }}">
            <div class="field-group">
                <label>Имя</label>
                <input type="text" name="username" required placeholder="Ваше имя">
            </div>
            <div class="field-group">
                <label>Email</label>
                <input type="email" name="email" required placeholder="your@email.com" autocomplete="email">
            </div>
            <div class="field-group">
                <label>Пароль</label>
                <input type="password" name="password" required placeholder="Минимум 6 символов" autocomplete="new-password">
            </div>
            <div class="field-group">
                <label>Подтверждение пароля</label>
                <input type="password" name="confirm_password" required placeholder="Повторите пароль" autocomplete="new-password">
            </div>
            <button class="btn btn-success btn-block" type="submit" style="margin-top:.5rem;">Создать аккаунт</button>
        </form>

        <div class="divider">или</div>

        <div class="social-btns">
            {% if google_configured %}
            <a class="social-btn google" href="{{ url_for('social_login', provider='google') }}">Google</a>
            {% else %}
            <span class="social-btn google disabled">Google</span>
            {% endif %}
            {% if github_configured %}
            <a class="social-btn github" href="{{ url_for('social_login', provider='github') }}">GitHub</a>
            {% else %}
            <span class="social-btn github disabled">GitHub</span>
            {% endif %}
        </div>

        <div class="link-row" style="margin-top:1rem;text-align:center;font-size:.82rem;">
            Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a>
        </div>
    </div>
</div>
</body>
</html>
