{% extends 'base.html' %}

{% block content %}
    <h1 class="page-title">Создание аккаунта Super CMS V12</h1>
    <p class="lead">Зарегистрируйтесь, чтобы управлять ботом, плагинами и AI-модулем.</p>
    {% if message %}
        <div class="message">{{ message }}</div>
    {% endif %}
    <form method="post">
        <div class="field-group">
            <label for="username">Имя пользователя</label>
            <input type="text" id="username" name="username" placeholder="Уникальный логин" required>
        </div>
        <div class="field-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="example@mail.com" required>
        </div>
        <div class="field-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" placeholder="Введите пароль" required>
        </div>
        <div class="field-group">
            <label for="confirm_password">Подтверждение пароля</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Повторите пароль" required>
        </div>
        <div style="margin-bottom: 20px;">
            <label><input type="checkbox" name="terms" required> Я согласен с условиями использования и политикой конфиденциальности</label>
        </div>
        <button type="submit" class="btn">Зарегистрироваться</button>
    </form>
    <p style="margin-top: 20px;">Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
    <div class="small-note">или войти через</div>
    <div class="social-btns">
        <a class="social-btn google" href="#">Google</a>
        <a class="social-btn github" href="#">GitHub</a>
        <a class="social-btn telegram" href="#">Telegram</a>
    </div>
{% endblock %}
